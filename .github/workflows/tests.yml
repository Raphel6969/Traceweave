name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    # The Python project is intentionally not present in the foundation slice.
    # Start this job automatically when pyproject.toml is added.
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest
