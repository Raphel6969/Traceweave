[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "traceweave"
version = "0.1.0"
description = "Evidence and provenance primitives for TraceWeave"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3", "fastapi>=0.110", "python-multipart>=0.0.9", "typer>=0.12"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/traceweave"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
